# Lint + unit tests on every push/PR. The Spider eval needs a local Ollama
# model, so it stays a local (documented) step rather than a slow fake in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -v
