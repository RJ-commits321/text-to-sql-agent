[project]
name = "text2sql"
version = "0.1.0"
description = "Local text-to-SQL agent with guardrails, evaluation and observability"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3",
    "sqlglot>=23.0",
    "streamlit>=1.35",
    "mlflow>=2.12",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "gdown>=5.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.ruff]
line-length = 100
src = ["src", "eval", "tests"]
extend-exclude = ["data"]  # downloaded Spider dataset ships stray Python 2 scripts

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
